server.port=0

# 审计流水本地存储目录
audit.storage-dir=${AUDIT_STORAGE_DIR:data/audit}
# 保留时长毫秒，0 表示不自动清理（可通过 /audit/retention 手动触发）
audit.retention-millis=${AUDIT_RETENTION_MILLIS:0}
# 到期处理方式：ARCHIVE（保留归档段）或 DELETE（归档段物理删除，仅留锚点）
audit.retention-mode=${AUDIT_RETENTION_MODE:ARCHIVE}
# 是否开启定时保留任务
audit.retention-schedule-enabled=false
# 定时保留任务间隔（毫秒）
audit.retention-schedule-millis=3600000
